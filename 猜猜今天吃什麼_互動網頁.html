<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index/title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: min(92%, 720px);
      text-align: center;
      background: white;
      padding: 42px 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 38px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #777;
      font-size: 17px;
    }

    .machine {
      position: relative;
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 22px;
      margin: 0 auto 25px;
      max-width: 600px;
      background: #eeeeee;
      border: 3px solid #333;
      border-radius: 16px;
      overflow: hidden;
    }

    .machine::before,
    .machine::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: #333;
      z-index: 3;
    }

    .machine::before { top: 50%; }
    .machine::after { bottom: calc(50% - 82px); opacity: 0; }

    .reel {
      width: 30%;
      height: 145px;
      background: white;
      border: 2px solid #444;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .reel span {
      font-size: 24px;
      font-weight: bold;
      padding: 8px;
    }

    .reel.spinning span {
      animation: shake 0.08s linear infinite;
    }

    @keyframes shake {
      0% { transform: translateY(-3px); }
      50% { transform: translateY(3px); }
      100% { transform: translateY(-3px); }
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #333;
      color: white;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:hover { transform: translateY(-2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #againBtn {
      display: none;
      margin-top: 12px;
      background: #666;
    }

    .result {
      min-height: 82px;
      margin: 20px auto 8px;
      padding: 16px;
      border-radius: 12px;
      background: #f2f2f2;
    }

    .result-title {
      font-size: 15px;
      color: #777;
    }

    .result-food {
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }

    @media (max-width: 560px) {
      .container { padding: 30px 16px; }
      h1 { font-size: 30px; }
      .reel { height: 125px; }
      .reel span { font-size: 18px; }
      .machine { padding: 14px 8px; gap: 6px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>猜猜今天吃什麼</h1>
    <p class="subtitle">不知道今天吃什麼？讓拉霸幫你決定！</p>

    <section class="machine" aria-label="美食拉霸">
      <div class="reel"><span>牛肉麵</span></div>
      <div class="reel"><span>炒飯</span></div>
      <div class="reel"><span>滷肉飯</span></div>
    </section>

    <button id="startBtn">🎰 開始拉霸</button>

    <div class="result">
      <div class="result-title">今天吃什麼？</div>
      <div class="result-food" id="resultFood">按下開始拉霸</div>
    </div>

    <button id="againBtn">再來一次</button>
  </main>

  <script>
    const foods = [
      "牛肉麵", "炒飯", "滷肉飯", "雞排",
      "水餃", "拉麵", "壽司", "漢堡",
      "披薩", "義大利麵", "火鍋", "咖哩飯",
      "鍋燒麵", "鹽酥雞", "鍋貼", "鐵板燒"
    ];

    const reels = document.querySelectorAll(".reel");
    const startBtn = document.getElementById("startBtn");
    const againBtn = document.getElementById("againBtn");
    const resultFood = document.getElementById("resultFood");

    let timerIds = [];

    function randomFood() {
      return foods[Math.floor(Math.random() * foods.length)];
    }

    function startSlot() {
      startBtn.disabled = true;
      againBtn.style.display = "none";
      resultFood.textContent = "正在幫你選...";
      timerIds.forEach(clearInterval);
      timerIds = [];

      reels.forEach((reel, index) => {
        reel.classList.add("spinning");

        const span = reel.querySelector("span");

        timerIds[index] = setInterval(() => {
          span.textContent = randomFood();
        }, 70);

        setTimeout(() => {
          clearInterval(timerIds[index]);
          reel.classList.remove("spinning");

          if (index === reels.length - 1) {
            const winner = randomFood();
            reels.forEach(r => {
              r.querySelector("span").textContent = winner;
            });

            resultFood.textContent = "🍴 " + winner;
            againBtn.style.display = "inline-block";
            startBtn.disabled = false;
          }
        }, 900 + index * 500);
      });
    }

    startBtn.addEventListener("click", startSlot);
    againBtn.addEventListener("click", startSlot);
  </script>
</body>
</html>
